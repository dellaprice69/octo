<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172b">
  <title>Octo Search</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #10172b;
      color: #f5f2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at 50% 30%, #29325b 0, transparent 56%),
        linear-gradient(160deg, #10172b, #17132d 75%);
    }

    main {
      width: min(100%, 980px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      letter-spacing: -0.06em;
    }

    .intro {
      margin: 0.5rem 0 1.5rem;
      color: #c4c7e4;
      font-size: 1.05rem;
    }

    .art {
      overflow: hidden;
      border: 1px solid #ffffff20;
      border-radius: 2rem;
      background: linear-gradient(180deg, #20264a99, #151a32cc);
      box-shadow: 0 24px 80px #05081780;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
    }

    .tentacle {
      fill: none;
      stroke: transparent;
      stroke-width: 46;
      stroke-linecap: round;
      pointer-events: stroke;
    }

    .tentacle-shadow {
      fill: none;
      stroke: #75489d;
      stroke-width: 31;
      stroke-linecap: round;
      pointer-events: none;
    }

    .tentacle-color {
      fill: none;
      stroke: url(#arm-gradient);
      stroke-width: 25;
      stroke-linecap: round;
      pointer-events: none;
      transition: stroke 160ms ease, stroke-width 160ms ease;
    }

    .suckers {
      fill: #f0caff;
      stroke: #9c64bf;
      stroke-width: 2;
      pointer-events: none;
    }

    .sucker-center {
      fill: #bd83db;
      stroke: none;
    }

    .leg-link:hover .tentacle-shadow,
    .leg-link:focus-visible .tentacle-shadow {
      stroke: #a16d39;
    }

    .leg-link:hover .tentacle-color,
    .leg-link:focus-visible .tentacle-color {
      stroke: #ffd479;
      stroke-width: 28;
    }

    .leg-link:focus-visible {
      outline: none;
    }

    .leg-label {
      fill: #fff;
      font-size: 17px;
      font-weight: 700;
      paint-order: stroke;
      stroke: #171a35;
      stroke-width: 5px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .body-shape {
      fill: #db91ff;
      stroke: #f4c9ff;
      stroke-width: 4;
    }

    .head-link {
      cursor: pointer;
    }

    .head-link:hover .body-shape,
    .head-link:focus-visible .body-shape {
      stroke: #ffd479;
      stroke-width: 7;
    }

    .eye {
      fill: #292044;
    }

    .shine {
      fill: #fff;
    }

    .spots {
      fill: #a863d2;
      opacity: 0.72;
    }

    .hint {
      margin: 1.25rem 0 0;
      color: #c4c7e4;
      font-size: 0.92rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 1.5rem 0.6rem;
      }

      .art {
        border-radius: 1.25rem;
      }

      .leg-label {
        font-size: 19px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Octo Search</h1>
    <p class="intro">Eight arms, eight ways to explore the web.</p>

</body>
</html>
